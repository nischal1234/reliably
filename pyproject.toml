[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reliably"
version = "0.1.0"
description = "Statistically rigorous model trust evaluation: calibration, uncertainty, and representation quality — with CIs and significance tests on every metric."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "reliably contributors" }]
keywords = ["calibration", "uncertainty", "ece", "auroc", "delong", "bootstrap", "disentanglement", "trustworthy-ml"]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
viz    = ["matplotlib>=3.7"]
report = ["jinja2>=3.1"]
sklearn = ["scikit-learn>=1.3"]
torch  = ["torch>=2.1"]
llm    = []
all    = ["reliably[viz,report,sklearn]"]
dev    = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.82",
    "mypy>=1.5",
    "ruff>=0.1",
    "mkdocs-material>=9.4",
    "mkdocstrings[python]>=0.23",
]

[project.urls]
Homepage = "https://github.com/nischal1234/reliably"
Documentation = "https://reliably.readthedocs.io"

[tool.hatch.build.targets.wheel]
packages = ["src/reliably"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = false

[tool.pytest.ini_options]
addopts = "-q --cov=reliably --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src"]
